<!DOCTYPE html>
<html>
<head>
<title>Spider Animator</title>
<style>
* {
margin: 0;
padding: 0;
box-sixing: border-box;
}
body {
width: 240px;
font-family: 'Segoe UI', sans-serif;
background: #0d0d0d;
color: #b0b0b0;
padding: 12px;
font-size: 11px;
}
h1 {
text-align: center;
color: #e85d1c;
font-size: 14px;
margin-bottom: 10px;
letter-spacing: 1px;
text-transform: uppercase;
}
.power-btn {
display: block;
margin: 0 auto 12px auto;
width: 44px;
height: 44px;
border-radius: 50%;
border: 2px solid #333;
background: #1a1a1a;
color: #4CAF50;
font-size: 18px;
cursor: pointer;
transition: all 0.2s;
line-height: 44px;
text-align: center;
padding: 0;
}
.power-btn:hover {
border-color: #4CAF50;
box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
}
.power-btn.off {
color: #f44336;
border-color: #333;
}
.power-btn.off:hover {
border-color: #f44336;
box-shadow: 0 0 8px rgba(244, 67, 54, 0.3);
}
.section {
background: #141414;
border: 1px solid #1f1f1f;
border-radius: 6px;
padding: 8px 10px;
margin-bottom: 6px;
}
.section-title {
color: #e85d1c;
font-size: 9px;
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 6px;
opacity: 0.8;
}
.row {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 5px;
}
.row:last-child {
margin-bottom: 0;
}
.row-label {
flex: 1;
color: #888;
}
.row input[type="number"] {
width: 52px;
background: #0d0d0d;
border: 1px solid #2a2a2a;
border-radius: 3px;
color: #ccc;
padding: 3px 5px;
font-size: 11px;
text-align: center;
}
.row input[type="number"]:focus {
outline: none;
border-color: #e85d1c;
}
input[type="checkbox"] {
accent-color: #e85d1c;
margin-right: 4px;
}
.check-label {
display: flex;
align-items: center;
color: #666;
font-size: 10px;
margin-top: 3px;
}
.web-row{
display: flex;
gap: 8px;
margin-bottom: 6px;
}
.web-row label {
display: flex;
align-items: center;
color: #888;
font-size: 10px;
flex: 1;
}
input[type="range"] {
width: 100%;
height: 3px;
-webkit-appearance: none;
appearance: none;
background: #2a2a2a;
border-radius: 2px;
outline: none;
margin-top: 4px;
}
input[type="range"]::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 10px;
height: 10px;
border-radius: 50%;
background: #e85d1c;
cursor: pointer;
}
.slider-row {
margin-top: 4px;
}
.slider-row label {
display: block;
color: #555;
font-size: 10px;
margin-bottom: 2px;
}
</style>
</head>
<body>
<h1>🕷 Spider</h1>
<button id="powerButton" class="power-btn">⏻</button>

<div class="section">
<div class="section-title">Movement</div>
<div class="row">
<label>Speed</label>
<input type="number" id="speed" min="1" max="1000" value="200">
</div>
<label class="check-label">
<input type="checkbox" id="variableSpeed"> +10% variation
</label>
<div class="row" style="margin-top:5px">
<label>Size</label>
<input type="number" id="size" min="10" max="500" value="100">
</div>
<label class="check-label">
<input type="checkbox" id="variableSize"> +20% variation
</label>
</div>

<div class="section">
<div class="section-title">Waves</div>
<div class="row">
<label>Count</label>
<input type="number" id="numSpiders" min="1" max="10" value="1">
</div>
<label class="check-label">
<input type="checkbox" id="variableNumSpiders"> +30% variation
</label>
<div class="row" style="margin-top:5px">
<label>Delay (sec)</label>
<input type="number" id="waveDelay" min="1" max="60" value="10">
</div>
<label class="check-label">
<input type="checkbox" id="variableWaveDelay"> +20% variation
</label>
</div>

<div class="section">
<div class="section-title">Webs</div>
<div class="web-row">
<label><input type="checkbox" id="enableLeftWeb"> Left</label>
<label><input type="checkbox" id="enableRightWeb"> Right</label>
</div>
<div class="slider-row">
<label>Left size</label>
<input type="range" id="leftWebSize" min="50" max="500" value="100">
</div>
<div class="slider-row">
<label>Right size</label>
<input type="range" id="rightWebSize" min="50" max="500" value="100">
</div>
</div>

<script src="popup.js"></script>
</body>
</html>
